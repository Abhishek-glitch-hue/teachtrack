<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/teachtrack-favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeachTrack</title>
  <script>
    const sessionToken = sessionStorage.getItem("teachtrack_token");
    const rememberedToken = localStorage.getItem("teachtrack_token");
    const rememberedUser = localStorage.getItem("teachtrack_user");

    if (!sessionToken && rememberedToken && rememberedUser) {
      sessionStorage.setItem("teachtrack_token", rememberedToken);
      sessionStorage.setItem("teachtrack_user", rememberedUser);
    }

    window.location.replace(
      sessionToken || (rememberedToken && rememberedUser) ? "main.html" : "login.html"
    );
  </script>
</head>
<body>
  <p>Opening TeachTrack…</p>
</body>
</html>
