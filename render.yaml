services:
  - type: web
    name: teachtrack-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://teachtrack-mepk.onrender.com
      - key: FRONTEND_URLS
        value: https://teachtrack-mepk.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TeachTrack

  - type: static_site
    name: teachtrack-frontend
    buildCommand: echo "TeachTrack frontend is ready"
    staticPublishPath: .
