<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TeachTrack Messages</title>
    <script>(function () { var theme = localStorage.getItem('teachtrack_theme'); if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme; })();</script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            height: 100vh;
            background: #edf2f4;
            color: #182630;
            font: 14px Arial, sans-serif
        }

        .chat-app {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 16px;
            height: 100%;
            padding: 18px
        }

        .panel {
            min-height: 0;
            border: 1px solid #dbe5e7;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 30px -25px #233
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .sidebar-top {
            padding: 18px 16px 12px;
            border-bottom: 1px solid #edf1f2
        }

        .sidebar-top h1 {
            margin: 0 0 12px;
            font-size: 20px
        }

        .search {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd8dc;
            border-radius: 9px;
            font: inherit;
            outline: 0
        }

        .search:focus,
        .composer textarea:focus {
            border-color: #0e8f84;
            box-shadow: 0 0 0 3px #dff3f0
        }

        .user-scroll {
            overflow: auto;
            padding: 8px
        }

        .list-title {
            margin: 12px 8px 6px;
            color: #74838b;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: .11em;
            text-transform: uppercase
        }

        .person {
            position: relative;
            display: flex;
            width: 100%;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            text-align: left;
            cursor: pointer
        }

        .person:hover,
        .person.active {
            background: #e7f5f3
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #dff3f0;
            color: #087a71;
            font-weight: 800
        }

        .person-copy {
            min-width: 0;
            flex: 1
        }

        .person-copy b,
        .person-copy small {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis
        }

        .person-copy small {
            margin-top: 3px;
            color: #64747c;
            font-size: 12px
        }

        .person-time {
            color: #74838b;
            font-size: 10px
        }

        .badge {
            display: grid;
            place-items: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 10px;
            background: #0e8f84;
            color: #fff;
            font-size: 10px;
            font-weight: bold
        }

        .empty {
            margin: 20px 10px;
            color: #718087;
            text-align: center;
            line-height: 1.5
        }

        .chat {
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .chat-head {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 15px 18px;
            border-bottom: 1px solid #edf1f2
        }

        .chat-head h2 {
            margin: 0;
            font-size: 16px
        }

        .chat-head p {
            margin: 3px 0 0;
            color: #66757d;
            font-size: 12px
        }

        .online-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 4px;
            border-radius: 50%;
            background: #1b9c68
        }

        .chat-head .spacer {
            flex: 1
        }

        .refresh {
            padding: 7px 10px;
            border: 1px solid #cbd8dc;
            border-radius: 8px;
            background: #fff;
            color: #3b525b;
            font-weight: bold;
            cursor: pointer
        }

        .message-area {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 10px;
            overflow: auto;
            padding: 20px;
            background: #f7fbfa
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: min(76%, 650px)
        }

        .message.mine {
            align-self: flex-end;
            align-items: flex-end
        }

        .bubble {
            padding: 10px 12px;
            border: 1px solid #dfe7ea;
            border-radius: 13px 13px 13px 3px;
            background: #fff;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .mine .bubble {
            border-color: #0e8f84;
            border-radius: 13px 13px 3px 13px;
            background: #0e8f84;
            color: #fff
        }

        .message-meta {
            color: #74838b;
            font-size: 10px
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #edf1f2;
            background: #fff
        }

        .composer textarea {
            flex: 1;
            min-height: 43px;
            max-height: 120px;
            padding: 11px;
            border: 1px solid #cbd8dc;
            border-radius: 9px;
            font: inherit;
            outline: 0;
            resize: vertical
        }

        .send {
            padding: 0 17px;
            border: 0;
            border-radius: 9px;
            background: #0e8f84;
            color: #fff;
            font-weight: bold;
            cursor: pointer
        }

        .send:disabled {
            opacity: .55;
            cursor: wait
        }

        .status {
            min-height: 21px;
            margin: 0;
            padding: 4px 14px;
            color: #b42336;
            font-size: 12px
        }

        .status.info {
            color: #087a71
        }

        html[data-theme="dark"] body { background: #141b20; color: #f1f5f6 }
        html[data-theme="dark"] .panel { background: #202a30; border-color: #35434b; box-shadow: 0 14px 30px -25px rgba(0,0,0,.8) }
        html[data-theme="dark"] .sidebar-top,
        html[data-theme="dark"] .chat-head,
        html[data-theme="dark"] .composer { border-color: #2b373e; background: #202a30 }
        html[data-theme="dark"] .search,
        html[data-theme="dark"] .composer textarea { background: #1a242a; border-color: #35434b; color: #f1f5f6; color-scheme: dark }
        html[data-theme="dark"] .search::placeholder,
        html[data-theme="dark"] .composer textarea::placeholder { color: #82939b }
        html[data-theme="dark"] .search:focus,
        html[data-theme="dark"] .composer textarea:focus { box-shadow: 0 0 0 3px #193f3c }
        html[data-theme="dark"] .person:hover,
        html[data-theme="dark"] .person.active { background: #193f3c }
        html[data-theme="dark"] .person-copy small,
        html[data-theme="dark"] .person-time,
        html[data-theme="dark"] .list-title,
        html[data-theme="dark"] .chat-head p,
        html[data-theme="dark"] .message-meta,
        html[data-theme="dark"] .empty { color: #afbdc3 }
        html[data-theme="dark"] .message-area { background: #1a242a }
        html[data-theme="dark"] .bubble { background: #263239; border-color: #35434b; color: #f1f5f6 }
        html[data-theme="dark"] .refresh { background: #263239; border-color: #40515a; color: #d7e1e4 }
        html[data-theme="dark"] .status.info { color: #70dfd2 }

        @media(max-width:720px) {
            .chat-app {
                grid-template-columns: 1fr;
                padding: 9px
            }

            .sidebar {
                max-height: 43vh
            }

            .chat {
                min-height: 50vh
            }
        }

        html.embedded body {
            background: transparent
        }

        @media(min-width:721px) {
            html.embedded .chat-app {
                height: 100vh;
                padding: 4px
            }
        }
    </style>
</head>

<body>
    <main class="chat-app">
        <aside class="panel sidebar">
            <div class="sidebar-top">
                <h1>Messages</h1><input class="search" id="userSearch" type="search"
                    placeholder="Search people by name or email">
            </div>
            <div class="user-scroll" id="peopleList"></div>
        </aside>
        <section class="panel chat">
            <header class="chat-head" id="chatHead">
                <div class="avatar">?</div>
                <div>
                    <h2>Select a conversation</h2>
                    <p>Find a colleague to start chatting.</p>
                </div><span class="spacer"></span><button class="refresh" id="refreshButton"
                    type="button">Refresh</button>
            </header>
            <div class="message-area" id="messageArea">
                <p class="empty">Your conversations and messages are private to your account.</p>
            </div>
            <form class="composer" id="chatForm"><textarea id="messageInput" maxlength="2000" disabled
                    placeholder="Type a message…"></textarea><button class="send" id="sendButton" disabled
                    type="submit">Send</button></form>
            <p class="status" id="chatStatus"></p>
        </section>
    </main>
    <script>window.addEventListener('storage', function (event) { if (event.key === 'teachtrack_theme' && (event.newValue === 'dark' || event.newValue === 'light')) document.documentElement.dataset.theme = event.newValue; });</script>
    <script src="http://localhost:4000/socket.io/socket.io.js"></script>
    <script>
        (() => { const token = sessionStorage.getItem('teachtrack_token'); if (!token) { window.top.location.href = 'login.html'; return } const state = { me: null, conversations: [], searchUsers: [], active: null }; const $ = id => document.getElementById(id); const api = (path, opt = {}) => { opt.headers = Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {}); return fetch('http://localhost:4000/api' + path, opt) }; const initials = name => (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase(); const dateTime = value => new Date(value).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); const preview = text => text.length > 46 ? text.slice(0, 46) + '…' : text; function setStatus(text = '', info = false) { const el = $('chatStatus'); el.textContent = text; el.className = 'status' + (info ? ' info' : '') } function addPerson(list, user, detail, unread) { const button = document.createElement('button'); button.className = 'person' + (state.active && state.active.id === user.id ? ' active' : ''); button.type = 'button'; button.innerHTML = '<span class="avatar"></span><span class="person-copy"><b></b><small></small></span><span class="person-side"></span>'; button.querySelector('.avatar').textContent = initials(user.name); button.querySelector('b').textContent = user.name; button.querySelector('small').textContent = detail; const side = button.querySelector('.person-side'); if (unread) { side.className = 'badge'; side.textContent = unread > 99 ? '99+' : unread } else if (detail && detail.createdAt) { side.className = 'person-time'; side.textContent = dateTime(detail.createdAt) } button.onclick = () => openChat(user); list.appendChild(button) } function renderPeople() { const list = $('peopleList'); list.innerHTML = ''; const searching = $('userSearch').value.trim(); const shown = {}; if (!searching && state.conversations.length) { list.insertAdjacentHTML('beforeend', '<p class="list-title">Recent conversations</p>'); state.conversations.forEach(item => { shown[item.user.id] = true; addPerson(list, item.user, preview(item.lastMessage.content), item.unreadCount) }) } const users = searching ? state.searchUsers : state.searchUsers.filter(user => !shown[user.id]); if (users.length) { list.insertAdjacentHTML('beforeend', '<p class="list-title">' + (searching ? 'Search results' : 'People') + '</p>'); users.forEach(user => addPerson(list, user, user.department || user.email, 0)) } if (!list.children.length) list.innerHTML = '<p class="empty">No users found. Create another account to begin a chat.</p>' } function renderMessages(messages) { const box = $('messageArea'); box.innerHTML = ''; if (!messages.length) { box.innerHTML = '<p class="empty">No messages yet. Say hello!</p>'; return } messages.forEach(message => { const mine = message.senderId === state.me.id; const item = document.createElement('article'); item.className = 'message' + (mine ? ' mine' : ''); item.innerHTML = '<div class="bubble"></div><span class="message-meta"></span>'; item.querySelector('.bubble').textContent = message.content; item.querySelector('.message-meta').textContent = dateTime(message.createdAt) + (mine ? (message.readAt ? ' · Seen' : ' · Sent') : ''); box.appendChild(item) }); box.scrollTop = box.scrollHeight } async function loadConversations() { const response = await api('/messages/conversations'); const data = await response.json(); if (!response.ok) throw new Error(data.message); state.conversations = data.conversations } async function loadUsers() { const response = await api('/messages/users?q=' + encodeURIComponent($('userSearch').value)); const data = await response.json(); if (!response.ok) throw new Error(data.message); state.searchUsers = data.users; renderPeople() } async function refresh() { try { setStatus('Refreshing…', true); await Promise.all([loadConversations(), loadUsers()]); setStatus(''); renderPeople() } catch (error) { setStatus(error.message || 'Unable to refresh messages.') } } async function openChat(user) { state.active = user; renderPeople(); $('chatHead').querySelector('.avatar').textContent = initials(user.name); $('chatHead').querySelector('h2').textContent = user.name; $('chatHead').querySelector('p').innerHTML = '<span class="online-dot"></span>' + (user.department || user.email); $('messageInput').disabled = true; $('sendButton').disabled = true; setStatus('Loading conversation…', true); try { const response = await api('/messages/' + encodeURIComponent(user.id)); const data = await response.json(); if (!response.ok) throw new Error(data.message); state.active = data.user; renderMessages(data.messages); $('messageInput').disabled = false; $('sendButton').disabled = false; $('messageInput').focus(); setStatus(''); loadConversations().then(renderPeople) } catch (error) { setStatus(error.message || 'Unable to load conversation.') } } $('chatForm').addEventListener('submit', async event => { event.preventDefault(); const content = $('messageInput').value.trim(); if (!state.active || !content) return; const button = $('sendButton'); button.disabled = true; try { const response = await api('/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ receiverId: state.active.id, content }) }); const data = await response.json(); if (!response.ok) throw new Error(data.message); $('messageInput').value = ''; await openChat(state.active); loadConversations().then(renderPeople) } catch (error) { setStatus(error.message || 'Unable to send message.') } finally { button.disabled = false } }); $('messageInput').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('chatForm').requestSubmit() } }); $('userSearch').addEventListener('input', () => { clearTimeout(window.searchTimer); window.searchTimer = setTimeout(loadUsers, 200) }); $('refreshButton').onclick = refresh; Promise.all([api('/auth/me').then(r => r.json()), refresh()]).then(([data]) => { state.me = data.user }); const socket = window.io('http://localhost:4000', { auth: { token } }); socket.on('message:new', payload => { refresh(); if (state.active && payload.sender.id === state.active.id) openChat(state.active); else setStatus('New message from ' + payload.sender.name + '.', true) }) })();
    </script>
</body>

</html>
