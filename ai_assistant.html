<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<title>TeachTrack â€” AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf2f4; --card:#ffffff; --border:#dfe7ea; --text:#182630; --muted:#5f6f79;
    --hover:#f2f6f7; --teal:#0e8f84; --teal-dark:#0b6e66; --teal-tint:#e0f2f0;
    --grad:linear-gradient(135deg,#14b8a6,#0b6e66);
    --topbar:rgba(255,255,255,.72);
  }
  html[data-theme="dark"]{
    --bg:#0c1416; --card:#151f22; --border:#26363b; --text:#e6eef0; --muted:#8ba0a8;
    --hover:#1b272b; --teal:#17a295; --teal-dark:#6fe3d5; --teal-tint:#11302d;
    --topbar:rgba(12,20,22,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

  /* ============ SIDEBAR ============ */
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;width:240px;
    background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 16px 16px;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px}
  .logo-tile{
    width:36px;height:36px;border-radius:10px;background:var(--grad);
    display:grid;place-items:center;color:#fff;flex:none;
  }
  .logo-tile svg{width:19px;height:19px}
  .brand-name{font-family:'Sora',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.2px;color:var(--text)}
  .brand-sub{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:600}

  .nav{margin-top:26px;display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-item{
    position:relative;display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:10px;color:var(--muted);
    text-decoration:none;font-weight:500;font-size:13.5px;
    transition:background .15s,color .15s;
  }
  .nav-item svg{width:19px;height:19px;flex:none}
  .nav-item:hover{background:var(--hover);color:var(--text)}
  .nav-item.active{background:var(--teal-tint);color:var(--teal-dark);font-weight:600}
  .nav-item.active::before{
    content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:var(--teal);
  }
  .badge{
    margin-left:auto;background:var(--teal);color:#fff;
    font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;line-height:1.5;
  }

  .profile{
    border-top:1px solid var(--border);padding:14px 8px 2px;
    display:flex;align-items:center;gap:10px;cursor:pointer;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;
    display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;flex:none;
  }
  .profile-label{flex:1;font-size:13px;font-weight:600;color:var(--text)}
  .profile svg{width:17px;height:17px;color:var(--muted)}

  /* ============ APP / TOP BAR ============ */
  .app{margin-left:240px;height:100vh;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:10;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 32px;background:var(--topbar);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .page-title{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.2px}
  .page-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .top-actions{display:flex;gap:10px}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;background:var(--card);
    border:1px solid var(--border);display:grid;place-items:center;
    color:var(--muted);cursor:pointer;position:relative;transition:border-color .15s,color .15s;
  }
  .icon-btn:hover{border-color:var(--teal);color:var(--teal-dark)}
  .icon-btn svg{width:18px;height:18px}
  .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#f43f5e;border:2px solid var(--card)}

  /* ============ CHAT AREA ============ */
  .chat-zone{flex:1;min-height:0;display:flex;padding:22px 32px 6px}
  .chat-card{
    width:100%;max-width:760px;margin:0 auto;background:var(--card);
    border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .chat-scroll{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column}
  .chat-scroll::-webkit-scrollbar{width:8px}
  .chat-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  /* Empty state */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  .empty-icon{
    width:64px;height:64px;border-radius:50%;background:var(--grad);
    display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(14,143,132,.25);
  }
  .empty-icon svg{width:27px;height:27px}
  .empty h1{margin-top:20px;font-family:'Sora',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.3px;color:var(--text)}
  .chips{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
  .chip{
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    padding:13px 18px;font-family:'Public Sans',sans-serif;font-size:13.5px;
    color:var(--text);cursor:pointer;text-align:center;transition:border-color .15s;
  }
  .chip:hover{border-color:var(--teal)}

  /* Messages */
  .messages{display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78%;padding:11px 15px;font-size:13.8px;line-height:1.55;white-space:pre-line}
  .msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-radius:16px 16px 4px 16px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:16px 16px 16px 4px}
  .typing{display:inline-flex;gap:5px;align-items:center;padding:16px 16px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  /* ============ COMPOSER ============ */
  .composer-wrap{flex:none;padding:10px 32px 22px}
  .composer{
    max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    padding:7px 7px 7px 18px;transition:border-color .15s,box-shadow .15s;
  }
  .composer:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,143,132,.12)}
  .composer .clip{width:18px;height:18px;color:var(--muted);flex:none;cursor:pointer;background:none;border:none;padding:0;display:grid;place-items:center}
  .composer .clip:hover{color:var(--teal-dark)}
  .composer input{flex:1;border:none;outline:none;background:transparent;font-family:'Public Sans',sans-serif;font-size:14px;color:var(--text)}
  .composer input::placeholder{color:var(--muted)}
  .send{
    width:40px;height:40px;border-radius:50%;border:none;background:var(--grad);
    color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;
    transition:filter .15s,transform .12s;
  }
  .send:hover{filter:brightness(1.1)}
  .send:active{transform:scale(.94)}
  .send svg{width:18px;height:18px}

  /* The dashboard supplies the navigation and header when this page is embedded. */
  html.embedded .sidebar,html.embedded .topbar{display:none}
  html.embedded .app{margin-left:0;height:100vh}
</style>
</head>
<body>

  <nav class="nav">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>

      <span class="badge">3</span>

    <a class="nav-item active" href="#" aria-current="page">

      AI Assistant
    </a>
  </nav>

  <div class="profile">
    <div class="avatar">J</div>
    <span class="profile-label">Profile Settings</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </div>
</aside>

<!-- ================= MAIN ================= -->
<div class="app">
  <header class="topbar">
    <div>
      <div class="page-title">AI Assistant</div>
      <div class="page-sub">Ask about your schedule, workload, or duties</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="chat-zone">
    <div class="chat-card">
      <div class="chat-scroll" id="chatScroll">

        <!-- Empty state -->
        <div class="empty" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>
          </div>
          <h1>Hi â€” how can I help with your workload today?</h1>
          <div class="chips">
            <button class="chip">Summarize my week</button>
            <button class="chip">Any schedule conflicts this month?</button>
            <button class="chip">Suggest a duty swap for Friday</button>
            <button class="chip">Draft a leave request email</button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>
      </div>
    </div>
  </section>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <button type="button" class="clip" aria-label="Attach file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input id="msgInput" type="text" placeholder="Ask TeachTrack AIâ€¦" autocomplete="off">
      <button type="submit" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>
</div>

<script>
  const chatScroll  = document.getElementById('chatScroll');
  const emptyState  = document.getElementById('emptyState');
  const messagesEl  = document.getElementById('messages');
  const form        = document.getElementById('composer');
  const input       = document.getElementById('msgInput');

  const replies = [
    { match: /(summar|week)/i,
      text: "Here's your week at a glance:\nâ€¢ 18 class sessions taught (Monâ€“Fri)\nâ€¢ 2 lunch-duty shifts (Tue & Fri)\nâ€¢ 3 staff meetings attended\nâ€¢ 42 assignments marked, 15 still pending\n\nYou're on track â€” Friday afternoon is your lightest slot if you need focus time." },
    { match: /(conflict|clash|overlap)/i,
      text: "I scanned your timetable and found 1 conflict this month:\nâ€¢ Thu, Oct 16 â€” Grade 9 Math (Period 4) overlaps with the department sync meeting.\n\nWant me to propose a reschedule or notify the coordinator?" },
    { match: /(swap|duty)/i,
      text: "For your Friday gate duty, I found a fair swap:\nâ€¢ Priya N. covers Friday, and you take her Wednesday recess duty next week.\n\nShall I send her the swap request?" },
    { match: /(leave|email|draft)/i,
      text: "Here's a draft you can send:\n\nSubject: Leave Request â€“ [Date]\n\nDear Principal,\nI would like to request leave on [date] due to personal commitments. I've prepared cover notes for my classes and will share worksheets in advance.\n\nThank you,\nJordan" },
  ];
  const fallback = "I can help with your timetable, duties, leaves, or overall workload â€” I pull live data from TeachTrack and summarize it for you. Try one of the suggestions or ask me anything.";

  function scrollBottom(){ chatScroll.scrollTop = chatScroll.scrollHeight; }

  function addMsg(role, text){
    emptyState.style.display = 'none';
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    messagesEl.appendChild(d);
    scrollBottom();
  }

  function send(){
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    addMsg('user', text);

    const typing = document.createElement('div');
    typing.className = 'msg ai typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typing);
    scrollBottom();

    const hit = replies.find(r => r.match.test(text));
    setTimeout(() => {
      typing.remove();
      addMsg('ai', hit ? hit.text : fallback);
    }, 1100);
  }

  form.addEventListener('submit', e => { e.preventDefault(); send(); });
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { input.value = c.textContent; send(); })
  );

  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
</script>
</body>
