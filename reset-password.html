<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeachTrack — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#182630;--mut:#5f6f79;--teal:#0e8f84;--line:#dfe7ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Public Sans",sans-serif;background:linear-gradient(135deg,#e7f4f3,#edf2f8);color:var(--ink)}.card{width:min(420px,100%);padding:34px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 24px 60px -35px rgba(24,38,48,.45)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:25px;font-family:Sora,sans-serif;font-size:19px;font-weight:800}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0b6e66);color:#fff}h1{margin:0;font:700 23px Sora,sans-serif}p{margin:7px 0 22px;color:var(--mut);font-size:13px}label{display:block;margin:13px 0 5px;font-size:12px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:none}input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,143,132,.12)}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:var(--teal);color:#fff;cursor:pointer;font:700 13px "Public Sans",sans-serif}button:disabled{opacity:.65;cursor:wait}.message{display:none;margin:14px 0 0;padding:10px;border-radius:8px;font-size:12px}.message.error{display:block;background:#fde7e9;color:#a52938}.message.success{display:block;background:#e2f7ed;color:#087a47}.back{display:block;margin-top:17px;text-align:center;color:var(--teal);font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo">T</span><span>TeachTrack</span></div>
    <h1>Set a new password</h1>
    <p>Choose a strong password with at least 8 characters.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submitButton" type="submit">Reset password</button>
      <div id="message" class="message" role="alert"></div>
    </form>
    <a class="back" href="login.html">Back to sign in</a>
  </main>
  <script src="assets/config.js"></script>
  <script>
    const API_URL = window.TEACHTRACK_API_ORIGIN + "/api";
    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("resetForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const showMessage = (text, type) => { message.textContent = text; message.className = `message ${type}`; };
    if (!token) { showMessage("This reset link is incomplete. Request a new password reset email.", "error"); submitButton.disabled = true; }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (password.value !== confirmPassword.value) { showMessage("The passwords do not match.", "error"); return; }
      submitButton.disabled = true; message.className = "message";
      try {
        const response = await fetch(`${API_URL}/auth/reset-password`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ token, password:password.value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Unable to reset password.");
        showMessage(data.message, "success");
        form.reset(); submitButton.disabled = true;
      } catch (error) { showMessage(error.message || "Network error. Is the backend running?", "error"); submitButton.disabled = false; }
    });
  </script>
</body>
</html>
